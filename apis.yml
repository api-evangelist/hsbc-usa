name: HSBC USA
kind: company
description: >-
  HSBC USA is the United States arm of HSBC Holdings plc, operating principally
  through HSBC Bank USA, N.A., a nationally chartered bank supervised by the
  Office of the Comptroller of the Currency (OCC). After exiting mass-market
  domestic retail banking in 2022 — selling its East Coast branches and national
  online deposit business to Citizens and its West Coast branches to Cathay Bank
  — HSBC refocused its US operations on global wholesale, commercial and
  corporate banking, global banking and markets, and wealth management for
  internationally connected clients. On the open-finance front, HSBC USA does
  not publish a US-specific first-party developer program; public API access is
  provided through HSBC's group-wide corporate and institutional Developer
  Portal (developer.hsbc.com), whose transaction-banking API products serve US
  wholesale clients but require registration and login to reach the actual API
  reference and specifications. There is no publicly downloadable OpenAPI, and
  consumer-permissioned data access for remaining US accounts is mediated
  through third-party aggregators rather than a documented first-party consumer
  data-sharing API.
