actions:
  openapiPath: null
  apisYmlUpdated: true
  reason: |
    Identity plus honest capture of HSBC's group corporate Developer Portal as
    the real (registration-gated) public API surface for HSBC USA wholesale
    clients. No spec was harvestable and no first-party US consumer/data-access
    API exists, so apis[] lists only the two globally-scoped corporate products
    with real documentation URLs, and no OpenAPI was saved.
